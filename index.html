<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanza Interrogatori (IA)</title>
    <style>
        body {
            background-color: #0b0d17;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suspect-card {
            background-color: #16192e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .suspect-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }
        .suspect-card p {
            margin: 0;
            font-size: 0.8rem;
            color: #949abf;
        }
        #chat-container {
            flex: 1;
            background-color: #101221;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-message {
            background-color: #5c35b1;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background-color: #1c203b;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a3058;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            background-color: #16192e;
            border: 1px solid #2a3058;
            border-radius: 24px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #6b72a3;
        }
        .btn-invia {
            background-color: #7c52df;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 0 22px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-invia:hover {
            background-color: #6842c1;
        }
        .btn-indagine {
            background-color: #16192e;
            color: #a0a5cb;
            border: 1px solid #2a3058;
            border-radius: 24px;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            width: fit-content;
            transition: background-color 0.2s;
        }
        .btn-indagine:hover {
            background-color: #1f2440;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header-title">
        🗣️ Stanza Interrogatori (IA)
    </div>

    <div class="suspect-card">
        <h3>Marco Ferri</h3>
        <p>Risposte generate in tempo reale dall'IA.</p>
    </div>

    <div id="chat-container">
        <!-- I messaggi della chat appariranno qui -->
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Fai qualsiasi domanda al sospetto..." onkeypress="handleKeyPress(event)">
        <button class="btn-invia" onclick="inviaMessaggio()">Invia</button>
    </div>

    <button class="btn-indagine" onclick="tornaIndagine()">← Torna all'Indagine</button>

    <script>
        // Chiave API integrata
        const API_KEY = "AQ.Ab8RN6Kweg6mEUR7umVAcIU6V6Cp6d68YhyFy8I9Ajf0CNyzaQ";

        async function inviaMessaggio() {
            const inputField = document.getElementById('user-input');
            const testoDomanda = inputField.value.trim();
            
            if (!testoDomanda) return;

            // Mostra il messaggio dell'utente nella chat
            aggiungiMessaggio(testoDomanda, 'user-message');
            inputField.value = '';

            // Endpoint di Google Gemini con la chiave fornita
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ 
                                text: "Sei un sospettato di nome Marco Ferri all'interno di un interrogatorio di polizia. Rispondi alla seguente domanda rimanendo rigorosamente nel personaggio, in modo misterioso e coerente con un'indagine: " + testoDomanda 
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                // Estrai la risposta dell'IA
                const rispostaIa = data.candidates[0].content.parts[0].text;
                aggiungiMessaggio(rispostaIa, 'ai-message');

            } catch (error) {
                console.error("Errore:", error);
                aggiungiMessaggio("Errore durante l'interrogatorio: " + error.message, 'ai-message');
            }
        }

        function aggiungiMessaggio(testo, classe) {
            const chatContainer = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${classe}`;
            div.innerText = testo;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                inviaMessaggio();
            }
        }

        function tornaIndagine() {
            // Sostituisci con il link alla pagina precedente se necessario (es. window.location.href = 'indagine.html';)
            window.history.back();
        }
    </script>
</body>
</html>
